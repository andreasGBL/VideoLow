name: CMake

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release

jobs:
      
  build_standard:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '5.15.2'
        arch: 'win64_msvc2019_64'
        cache: true

    - name: Verify compressed FFmpeg tools
      shell: pwsh
      run: |
        $files = @("ffmpeg.exe.qcomp", "ffprobe.exe.qcomp")
        foreach ($file in $files) {
          if (!(Test-Path $file)) { throw "Missing compressed FFmpeg tool: $file" }
          if ((Get-Item $file).Length -ge 100MB) { throw "Compressed FFmpeg tool exceeds GitHub's 100 MB file limit: $file" }
        }
      
    - name: Configure Standard
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DPROJECT_NAME="VideoLow" -DHARDWARE_ACCELERATION_DEFAULT=0 -DWITH_CONSOLE=0

    - name: Build Standard
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}
      
